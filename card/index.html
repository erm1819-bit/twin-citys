<style>
  /* Layout: one screen — compact masthead, the three doors grow to fill the middle
     as bordered tiles (matching the /start form's tile style), dusk horizon foot.
     Tokens lifted verbatim from twincitys.net/start. */
  :root {
    --black: #0b0b0b;
    --ivory: #e8e3d9;
    --stone: #a19b90;
    --stone-dim: #4a4743;
    --line: rgba(232, 227, 217, 0.18);
    --amber: #f0b36a;
    --coral: #e8846b;
    --dusk-pink: #e9a3b4;
    --font-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
    --font-body: 'Montserrat', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
    color-scheme: dark;
  }

  html, body { height: 100%; }

  body {
    background: var(--black);
    color: var(--ivory);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(1.5rem, 4.5vh, 2.5rem);
    max-width: 34rem;
    margin-inline: auto;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- masthead ---- */

  .eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.9rem;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: clamp(0.65rem, 2.8vw, 1rem);
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 11.5vw, 3.4rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 0.95;
  }

  .mark .rule {
    flex: none;
    width: 1px;
    align-self: stretch;
    background: var(--ivory);
    opacity: 0.55;
  }

  .tagline {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.125rem;
    color: var(--stone);
    margin-top: 0.7rem;
  }

  /* ---- the three doors ---- */

  .doors {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(0.8rem, 2.4vh, 1.3rem);
    margin-block: clamp(1.4rem, 4vh, 2.2rem);
  }

  .door {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    column-gap: 1rem;
    row-gap: 0.2rem;
    padding: clamp(1rem, 2.6vh, 1.4rem) 1.15rem;
    text-decoration: none;
    color: var(--ivory);
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.025);
    transition: border-color 140ms ease, background-color 140ms ease;
  }

  .door .icon {
    grid-row: 1 / span 2;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--stone);
  }

  .door .icon svg { width: 26px; height: 26px; }
  .door .icon img { width: 30px; height: auto; display: block; }

  .door .label {
    font-size: 1.0625rem;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .door .note {
    grid-column: 2;
    font-family: var(--font-display);
    font-size: 1rem;
    line-height: 1.3;
    color: var(--stone);
  }

  .door .arrow {
    grid-row: 1 / span 2;
    grid-column: 3;
    font-size: 1.2rem;
    line-height: 1;
    color: var(--stone);
    transition: transform 160ms ease;
  }

  .door:hover {
    border-color: var(--amber);
    background: rgba(240, 179, 106, 0.09);
  }

  .door:hover .arrow { transform: translateX(3px); }

  /* primary door — the /start form's go-button gradient */
  .door--primary {
    background: linear-gradient(100deg, var(--amber), var(--coral));
    border-color: transparent;
    color: #1a1208;
  }

  .door--primary .label { font-weight: 600; }

  .door--primary .icon,
  .door--primary .note,
  .door--primary .arrow { color: rgba(26, 18, 8, 0.72); }

  .door--primary:hover {
    border-color: transparent;
    background: linear-gradient(100deg, var(--amber), var(--coral));
    filter: brightness(1.05);
  }

  .door:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .door, .door .arrow { transition: none; }
    .door:hover .arrow { transform: none; }
  }

  /* ---- foot ---- */

  .horizon {
    height: 1px;
    border: 0;
    margin: 0 0 0.9rem;
    background: linear-gradient(90deg, var(--dusk-pink), var(--amber) 55%, transparent);
    opacity: 0.8;
  }

  .foot p {
    margin: 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--stone);
  }

  /* ---- micro boot: the site's opener, in miniature ---- */

  :root { --ease: cubic-bezier(0.3, 0.7, 0.2, 1); }

  @keyframes boot-rule  { from { transform: scaleY(0); } }
  @keyframes boot-left  { from { opacity: 0; transform: translateX(-18px); } }
  @keyframes boot-right { from { opacity: 0; transform: translateX(18px); } }
  @keyframes boot-fade  { from { opacity: 0; } }
  @keyframes boot-rise  { from { opacity: 0; transform: translateY(10px); } }
  @keyframes boot-sweep { from { transform: scaleX(0); } }

  .mark .rule { transform-origin: top; animation: boot-rule 420ms var(--ease) backwards; }
  .mark span:first-child { animation: boot-left 560ms var(--ease) 100ms backwards; }
  .mark span:last-child { animation: boot-right 560ms var(--ease) 100ms backwards; }
  .eyebrow { animation: boot-fade 400ms ease-out 420ms backwards; }
  .tagline { animation: boot-fade 400ms ease-out 500ms backwards; }
  .doors .door:nth-child(1) { animation: boot-rise 460ms var(--ease) 280ms backwards; }
  .doors .door:nth-child(2) { animation: boot-rise 460ms var(--ease) 380ms backwards; }
  .doors .door:nth-child(3) { animation: boot-rise 460ms var(--ease) 480ms backwards; }
  .horizon { transform-origin: left; animation: boot-sweep 600ms var(--ease) 580ms backwards; }
  .foot p { animation: boot-fade 400ms ease-out 720ms backwards; }

  @media (prefers-reduced-motion: reduce) {
    .mark .rule, .mark span, .eyebrow, .tagline, .doors .door, .horizon, .foot p { animation: none; }
  }

  /* ---- skyline film: bay -> Brickell towers -> back, looped behind everything ---- */

  .film {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: var(--black) url("poster-tall.jpg") center / cover no-repeat;
  }

  .film video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 900ms ease;
  }

  .film.is-playing video { opacity: 1; }

  /* darken top (wordmark) and bottom (footer) hardest; let the towers glow through the middle */
  .film::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(11, 11, 11, 0.74) 0%,
      rgba(11, 11, 11, 0.22) 34%,
      rgba(11, 11, 11, 0.34) 62%,
      rgba(11, 11, 11, 0.86) 100%);
  }

  header, .doors, .foot { position: relative; z-index: 1; }
  header { text-shadow: 0 1px 18px rgba(0, 0, 0, 0.5); }

  /* frosted doors so they stay readable over the moving city */
  .door {
    background: rgba(11, 11, 11, 0.42);
    -webkit-backdrop-filter: blur(10px) saturate(1.15);
    backdrop-filter: blur(10px) saturate(1.15);
  }

  .door:hover { background: rgba(48, 34, 20, 0.55); }
</style>

<script>
  // Carry the scan source through to the form: twincitys.net/card?from=ig -> /start?from=ig.
  // A bare /card (what the printed QR points at) falls through to "card".
  (function () {
    var raw = new URLSearchParams(window.location.search).get('from');
    var from = /^[a-z0-9_-]{1,24}$/i.test(raw || '') ? raw : 'card';
    var start = document.getElementById('door-start');
    if (start) {
      start.href = 'https://twincitys.net/start?from=' + encodeURIComponent(from);
    }
  })();
</script>

<script>
  // Background skyline film. The poster paints instantly; the film fades in once it is actually playing.
  (function () {
    var film = document.getElementById('film');
    var video = document.getElementById('film-video');
    if (!film || !video) return;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var saveData = navigator.connection && navigator.connection.saveData;
    if (reduceMotion || saveData) return;
    video.addEventListener('playing', function () { film.classList.add('is-playing'); }, { once: true });
    video.src = 'tall.mp4';
    var started = video.play();
    if (started && started.catch) started.catch(function () {});
  })();
</script>
